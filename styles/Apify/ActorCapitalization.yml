extends: substitution
message: "Use '%s' instead of '%s' for the Apify product concept."
ignorecase: false
level: suggestion
scope: heading

exceptions:
  - '\b[Hh]uman actors?\b'
  - '\bpath from actors? to actor[-_/][A-Za-z0-9_-]*\b'
  - "<code>"
  - "`"
  - "apify-actor"

swap:
  '(?<![-_/.])\bactor(s?)\b(?![-_/]|\.[A-Za-z0-9])': 'Actor$1'
