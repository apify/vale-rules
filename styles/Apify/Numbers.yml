extends: substitution
level: warning
message: "Use correct number formatting: '%s' instead of '%s'."
ignorecase: false
scope:
  - summary
  - heading
exceptions:
  - '\b\d{4}-\d{2}-\d{2}\b'
  - '\b\d{4}\.\d{2}\.\d{2}\b'
  - 'T\d{2}:\d{2}:\d{2}'
  - 'v\d+\.\d+\.\d+'
swap:

  
  

  'GBs': 'GB'
  'MBs': 'MB'
  'KBs': 'KB'
  'TBs': 'TB'
