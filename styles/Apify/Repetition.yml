extends: existence
level: suggestion
message: "Repeated word: '%s'."
ignorecase: true
nonword: true
scope: sentence
tokens:
  - '\b(\w+)\s+\1\b'
exceptions:
  # "add-on on", "log-in in", "sign-up up" — the repeated word is part of a
  # hyphenated compound. The standalone preposition/particle is correct grammar.
  - '(?:add-on|log-in|sign-up|opt-in|check-in|drop-off|set-up|pick-up|run-up|follow-up)\s+(?:on|in|up|off)'
