extends: substitution
level: suggestion
message: "Use the contraction: '%s' instead of '%s'."
ignorecase: false
exceptions:
  - '\[DANGER[!]*\][\s\S]*'
  - "are unable to"
  - 'irreversible[\s\S]*'
  - 'permanently delete[\s\S]*'
  - 'permanently remove[\s\S]*'
  - 'will be lost forever[\s\S]*'
  - '\w+ing it will'
  - "with you will"
  - "It will (?:appear|show|be shown|be displayed|be visible)"
  - 'It is .\d'
  - "here is going to"
  - 'here is (?:prefill|fill|display|show|render|configur|provid|generat|stor|creat|load|sav|enabl|disabl)\w*ed'
  - "must not be"
  - "must not exceed"
  - '[Dd]o not share (?:the |your |this )?(?:passwords?|tokens?|credentials?|keys?|secrets?)\b'
  - "as they are"
  - "ensuring they are"
  - 'you would \w+ing'
