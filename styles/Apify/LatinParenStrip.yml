# Detection only: flags 2 patterns without suggesting replacements.
extends: existence
level: suggestion
message: "Redundant Latin abbreviation in parentheses: '%s'."

exceptions:
  - '\(e\.g\.[^)]*$'

tokens:
  - '\(i\.e\.,? '
  - '\(e\.g\.,? '

action:
  name: edit
  params:
    - regex
    - '\(i\.e\.,? (its|it|the|this|that|they|their|you|your|we|a|an) '
    - '($1 '
