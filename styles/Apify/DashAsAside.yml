extends: existence
level: suggestion
message: "Dash as aside: '%s'. Restructure the sentence. Split into two sentences or use a comma/colon."
nonword: true
ignorecase: false

tokens:
  # A dated title is not a term-description definition.
  - '(?<=\w) - (?=(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d)'
  - '(?<!(?:^|\n)[ \t]*(?:(?:[-+*]|\d+[.)])[ \t]+)?(?:\*\*|_|\*|`)?(?!(?:This|That|It|We|You|Our|Your)\b)[A-Z][\w/.+-]*(?:[ \t]+(?!(?:is|are|was|were|has|have|can|will|should|must)\b)[\w/.+-]+){0,5}(?:\*\*|_|\*|`)?)(?<=\w) - (?=[A-Z])'
  - '(?<!\b\d+(?::\d+)?[ \t]*[AP]M)(?<=\w) - (?=[a-z0-9_])'
  - '(?<!(?:^|\n)[ \t]*(?:(?:[-+*]|\d+[.)])[ \t]+)?(?:\*\*|_|\*|`)?(?!(?:This|That|It|We|You|Our|Your)\b)[A-Z][\w/.+-]*(?:[ \t]+(?!(?:is|are|was|were|has|have|can|will|should|must)\b)[\w/.+-]+){0,5}(?:\*\*|_|\*|`)?[ \t])(?<!\d)–(?=[ \t]+[A-Z])'
  - '(?<!\d)–(?!\d|[ \t]+[A-Z])'
