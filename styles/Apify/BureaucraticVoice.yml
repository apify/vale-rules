  - '\bsubsequently\b'
  - '\bconsequently\b'
  - '\bfurthermore\b'
  - '\bmoreover\b'
  - '\bhenceforth\b'
  - '\bnevertheless\b'
  - '\bnonetheless\b'

  - '\bmentioned above\b'
  - '\blisted above\b'
  - '\bstated above\b'
  - '\bas shown below\b'
  - '\bas described above\b'
  - '\bas noted above\b'

  - '\bfor some reason\b'
  - '\bfor whatever reason\b'
  - '\bin the event that\b'
  - '\bin the event of\b'

  - '\bit is recommended\b'
  - '\bit is suggested\b'
  - '\bit is advised\b'
  - '\byou are advised to\b'
  - '\byou are encouraged to\b'

  - '\bat your earliest convenience\b'
  - '\bwe would like to inform\b'
  - '\bwe would like to remind\b'
  - '\bwe wish to inform\b'
  - '\bplease be advised\b'

  - '\band\/or\b'
  - '\bpursuant to\b'
  - '\bnotwithstanding\b'
  - '\bin accordance with\b'

  - '\bwork accordingly\b'
  - '\bact accordingly\b'
  - '\bproceed accordingly\b'

  - '\bfor the purpose of\b'
