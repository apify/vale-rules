extends: substitution
level: suggestion
message: "Use a stronger verb: '%s' instead of '%s'."
exceptions:
  # "may...might not" - avoid double "may" when "may" already appears earlier.
  - '\bmay\b[\s\S]{0,60}\bmight not\b'
  # "complete the creation of" - "complete" takes a noun, not a gerund.
  # "To complete creating X" is ungrammatical. Keep the nominalization here.
  - "complete the creation of"
  # "be able to log-in" / "be able to login" - source uses wrong verb form;
  # removing "be able to" would leave "might not log-in" / "might not login" (wrong).
  # Guard these so the source bug isn't exposed.
  - 'be able to log.?in\b'
  # Plural subject + "allows" - subject-verb disagreement in source.
  # "runs allows you to" is a grammar bug; our rule shouldn't make it worse
  # by producing "runs lets you". The safe-transforms literal handles the fix.
  - '\bruns allows you to'
  # "won't be able to ... anymore" - future consequence in destructive dialogs.
  # "You won't be able to run it anymore" is future-tense (action hasn't happened yet).
  # "Can't" implies current inability, which is wrong in this context.
  - 'won.t be able to[\s\S]{0,80}?anymore'
  # Third-party "won't be able to" - future consequence for another entity.
  # "The application won't be able to access..." describes what happens to a
  # third party AFTER the user acts. "can't" would imply it currently can't.
  # Guard: only fires when subject is NOT "you/they" (those are direct constraints).
  - '\b(?:application|service|integration|app|script|token)\b[\s\S]{0,30}?won.t be able to'
  # NOTE: IMPORTANT/WARNING + "will be able to" is handled by skip-if above.
swap:
  'is able to': 'can'
  'are able to': 'can'
  'has the ability to': 'can'
  'have the ability to': 'can'
  'allows you to': 'lets you'
  'allows users to': 'lets users'
  'allow you to': 'let you'
  'allow users to': 'let users'
  'will be able to': 'can'
  'will have to be': 'must be'
  "you'll have to": 'you must'
  "you'll be able to": 'you can'
  "won't be able to": "can't"
  'might not be able to': 'may not be able to'
  'make a decision': 'decide'
  'make a replacement': 'replace'
  'make an improvement to': 'improve'
  'make an improvement': 'improve'
  'make a modification to': 'modify'
  'make a modification': 'modify'
  'make a change to': 'change'
  'make a change': 'change'
  'make an application': 'apply'
  'give consideration to': 'consider'
  'give notification to': 'notify'
  'give notification': 'notify'
  'provide assistance to': 'help'
  'provide assistance': 'help'
  'provide notification to': 'notify'
  'provide notification': 'notify'
  'provide information about': 'inform you about'
  'provide information': 'inform you'
  'perform an evaluation of': 'evaluate'
  'perform an evaluation': 'evaluate'
  'conduct an investigation into': 'investigate'
  'conduct an investigation': 'investigate'
  'conduct an analysis of': 'analyze'
  'conduct an analysis': 'analyze'
  'carry out a review of': 'review'
  'carry out a review': 'review'
  'gain an understanding of': 'understand'
  'gain an understanding': 'understand'
  'have an understanding of': 'understand'
  'make the payment': 'pay'
  'undertake a calculation of': 'calculate'
  'undertake a calculation': 'calculate'
  'undertake the calculation of': 'calculate'
  'undertake the calculation': 'calculate'
  'the creation of': 'creating'
  'the development of': 'developing'
  'the implementation of': 'implementing'
  'the production of': 'producing'
  'the assessment of': 'assessing'
  'the evaluation of': 'evaluating'
