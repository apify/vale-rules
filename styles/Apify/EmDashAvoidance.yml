extends: substitution
level: warning
message: "Replace em dash with appropriate punctuation: '%s' instead of '%s'."
nonword: true
scope:
  - sentence
  - heading
exceptions:
  - '\u2014[^—]*\u2014'
swap:
  'badge — awarded to the top 20 Actors.': 'badge. It goes to the top 20 Actors on Apify.'

  ' — awarded': ', awarded'
  ' — designed': ', designed'
  ' — built': ', built'
  ' — used': ', used'
  ' — given': ', given'
  ' — created': ', created'
  ' — intended': ', intended'
  ' — available': ', available'
  ' — required': ', required'

  ' — ': '. '
