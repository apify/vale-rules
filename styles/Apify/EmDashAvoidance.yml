extends: existence
level: warning
message: "Replace the em dash in '%s' with punctuation appropriate to the sentence, or rewrite the sentence."
nonword: true
scope:
  - sentence
  - heading

# A punctuation choice depends on whether the following text is a clause or
# a fragment. Do not propose a generic period split or comma replacement.
# Exactly one em dash preserves the existing paired-aside exemption.
tokens:
  - '^([^—]*) — ([^—]*)$'
