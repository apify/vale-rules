# Detection only: flags 1 pattern without suggesting replacements.
extends: existence
level: suggestion
message: "Double 'You can': '%s'. Drop the first 'You can' when the second already uses it."

tokens:
  - 'You can [a-z][^.]+\. You can also'

action:
  name: edit
  params:
    - regex
    - 'You can ([a-z])([^.]+)\. You can also'
    - '$1$2. You can also'
