extends: substitution
level: warning
message: "Use the correct brand name or casing: '%s' instead of '%s'."
ignorecase: false
exceptions:
  - 'https?://\S+'
  - "https?://"
  - "<[^>]+>"
  - '[a-zA-Z0-9._-]+\.[a-zA-Z]{2,}'
  - '\w+\.com'
  - '\w+\.org'
  - '\w+\.io'
  - '\w+\.dev'
  - '\w+\.net'
  - "text/html"
  - 'text/\w+'
  - "application/json"
  - "application/xml"
  - 'application/xhtml\+xml'
  - 'application/\w+'
  - 'image/\w+'
  - "[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+"
  - 'git@\S+'
  - '\{[^}]*\}'
  - '\w+\.json\b'
  - "application/json"
  - "content-type"
  - '\bthe rest\b'
  - '\brest of\b'
  - '\brest will\b'
  - '\brest are\b'
  - '\brest is\b'
  - '\w+/\w+'
  - "apify/"
  - "/apify"
  - '[a-z]pify-\w+'
  - '[.\"]apify[.\"]'
  - '\(apify/'
swap:
  'addon': 'add-on'
  'addons': 'add-ons'
  'Addon': 'Add-on'
  'Addons': 'Add-ons'
  Apify-client: 'apify-client'
