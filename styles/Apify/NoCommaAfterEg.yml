extends: existence
message: "Apify style: omit the comma after 'e.g.' or 'i.e.'. Write 'e.g. Node.js' instead of 'e.g., Node.js'."
level: suggestion
# Parsed paragraphs retain abbreviation punctuation while excluding code and attributes.
scope: paragraph
nonword: true
tokens:
  - '\b(?:e\.g\.|i\.e\.),\s'
