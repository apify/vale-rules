extends: existence
message: "Apify style: omit the comma after 'e.g.' or 'i.e.'. Write 'e.g. Node.js' instead of 'e.g., Node.js'."
level: suggestion
# Parsed prose includes lists and blockquotes while excluding code and front matter.
scope: text & ~frontmatter
nonword: true
tokens:
  - '\b(?:e\.g\.|i\.e\.),\s'
