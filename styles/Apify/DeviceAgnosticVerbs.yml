extends: substitution
level: warning
message: "Device-specific verb: '%s' instead of '%s'. Use input-neutral language for tabs, menus, and options."
ignorecase: true
scope:
  - sentence
  - heading

swap:
  'click on the': 'select the'
  'click on': 'select'
  'click the tab': 'select the tab'
  'click the menu': 'select the menu'
  'click the dropdown': 'select the dropdown'
  'click the option': 'select the option'
  'click the section': 'select the section'
  'click the item': 'select the item'
  'by clicking': 'by selecting'

exceptions:
  # Analytics terminology
  - "click-through"
  - "click rate"
  # Drag interactions
  - "click and drag"
  - "drag and drop"
  # Email/hyperlink context
  - "click the link"
  - "click the verification link"
  - "click the confirmation link"
