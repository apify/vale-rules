extends: existence
level: warning
message: "Device-specific verb: '%s' - use 'select' for tabs, menus, and options (not everyone uses a mouse). 'Click' is fine for buttons."
ignorecase: true

tokens:
  - 'click on the'
  - 'click on'
  - 'click the tab'
  - 'click the menu'
  - 'click the dropdown'
  - 'click the option'
  - 'click the section'
  - 'click the item'
  - 'by clicking'

exceptions:
  - "click-through"
  - "click rate"
  - "click and drag"
  - "drag and drop"
  - "click the link"
  - "click the verification link"
  - "click the confirmation link"
