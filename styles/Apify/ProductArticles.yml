extends: existence
level: warning
ignorecase: false
message: "Write 'the' before the product name in '%s'. This product takes the definite article."
nonword: true
vocab: false
scope:
  - summary
tokens:
  # A preceding lowercase word marks running prose. Without one the name is
  # a heading, a list entry, or link text, where the article is not expected.
  # The lookbehind skips up to two modifiers after a determiner, as in "the
  # recently updated Apify SDK" or "your updated Apify SDK". A wider window
  # would also swallow real misses such as "the guide and use Apify API".
  # The trailing guards skip the compound-noun use, where the name modifies a
  # following noun: "Apify API token", "Apify SDK-based tools".
  - '\b(?<!\b(?:the|your|our|their|its|my|this|that) (?:[\w-]+ )?)(?!(?:the|your|our|their|its|my|this|that|latest|full|new|official|current|authorized|authenticated|underlying|same|entire|whole|public|free|old|deprecated)\b)[a-z][\w-]* Apify (?:SDK|CLI|API)\b(?!-)(?! (?:[A-Z]|token|tokens|key|keys|command|commands|call|calls|client|clients|reference|docs|documentation|endpoint|endpoints|request|requests|response|responses|method|methods|version|versions|user|users|integration|integrations|credentials|scopes|permissions|install|installation|schema|schemas))'
  - '\b(?<!\b(?:the|your|our|their|its|my|this|that) (?:[\w-]+ )?)(?!(?:the|your|our|their|its|my|this|that|latest|full|new|official|current|authorized|authenticated|underlying|same|entire|whole|public|free|old|deprecated)\b)[a-z][\w-]* Apify platform\b(?!-)(?! (?:[A-Z]|usage|account|accounts|credits|costs|limits|pricing|billing|plan|plans|docs|documentation|features|services|team|developer|developers))'
  # Verb/preposition tokens: a product introduced directly by a verb or
  # preposition still needs "the", even when an unrelated determiner appears
  # earlier in the sentence. The determiner lookbehind above over-suppresses
  # "Read the guide using Apify API" and "Use your guide with Apify SDK"
  # (the article belongs to "guide", not the product), and it misses the
  # sentence-initial "Install Apify CLI" because it requires a lowercase word
  # before the name. Anchoring on the verb/preposition immediately before
  # "Apify" catches these while leaving "the latest Apify SDK" untouched
  # (that word is an adjective, not a verb). Same trailing compound-noun and
  # hyphen guards as above; the leading guards skip :::tip/:::note callouts
  # and literal "Search ..." queries.
  - '(?<!:::tip )(?<!:::note )(?<![Ss]earch )\b(?:[Ww]ith|[Uu]sing|[Uu]se|[Uu]ses|[Uu]sed|[Vv]ia|[Tt]hrough|[Oo]n|[Oo]nto|[Tt]o|[Ff]rom|[Ii]n|[Ii]nto|[Oo]f|[Ff]or|[Bb]y|[Aa]bout|[Aa]gainst|[Ww]ithout|[Ww]ithin|[Ii]nstall|[Cc]onfigure|[Aa]ccess|[Uu]pdate|[Uu]pgrade|[Dd]ownload|[Oo]pen|[Ll]aunch|[Tt]ry|[Tt]est|[Cc]all|[Qq]uery|[Ss]upport|[Ss]upports)[ \t]+Apify (?:SDK|CLI|API)(?!-)\b(?![ \t]+(?:[A-Z]|token|tokens|key|keys|command|commands|call|calls|client|clients|reference|docs|documentation|endpoint|endpoints|request|requests|response|responses|method|methods|version|versions|user|users|integration|integrations|credentials|scopes|permissions|install|installation|schema|schemas|package|packages|settings|configuration|options|features|examples|output|data|logs))'
  - '(?<!:::tip )(?<!:::note )(?<![Ss]earch )\b(?:[Ww]ith|[Uu]sing|[Uu]se|[Uu]ses|[Uu]sed|[Vv]ia|[Tt]hrough|[Oo]n|[Oo]nto|[Tt]o|[Ff]rom|[Ii]n|[Ii]nto|[Oo]f|[Ff]or|[Bb]y|[Aa]bout|[Aa]gainst|[Ww]ithout|[Ww]ithin|[Ii]nstall|[Cc]onfigure|[Aa]ccess|[Uu]pdate|[Uu]pgrade|[Dd]ownload|[Oo]pen|[Ll]aunch|[Tt]ry|[Tt]est|[Cc]all|[Qq]uery|[Ss]upport|[Ss]upports)[ \t]+Apify platform(?!-)\b(?![ \t]+(?:[A-Z]|usage|account|accounts|credits|costs|limits|pricing|billing|plan|plans|docs|documentation|features|services|team|developer|developers|settings|configuration|options))'
