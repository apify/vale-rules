extends: existence
level: suggestion
message: "Latin abbreviation: '%s'. (i.e. = 'that's'; e.g. = 'for example')"
ignorecase: false
nonword: true

exceptions:

tokens:
  - 'i\.e\.,? \w+, \w+'
  - 'i\.e\.,? (?:such as|like) '

action:
  name: edit
  params:
    - regex
    - 'i\.e\., '
    - 'e.g. '
