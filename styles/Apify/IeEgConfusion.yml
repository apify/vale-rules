extends: existence
level: suggestion
message: "Possible i.e./e.g. confusion: '%s' - if listing examples, use 'e.g.' (for example). 'i.e.' means 'that is' (restating the same thing)."
ignorecase: false

exceptions:
  # "i.e., the [noun]" - genuine restatement/clarification
  - 'i\.e\.,? the \w+'
  # "i.e., [proper noun]" - naming the specific thing (restatement)
  - 'i\.e\.,? [A-Z][a-z]+'

tokens:
  - 'i\.e\.,? \w+, \w+'
  - 'i\.e\.,? (?:such as|like)'
