extends: existence
level: suggestion
message: "Check the intended meaning of '%s': 'i.e.' means 'that is'; 'e.g.' means 'for example'. Rewrite the repeated introducer as needed."
ignorecase: false
nonword: true
scope: paragraph

# Do not infer confusion from comma-separated lists: they can be complete restatements.
# Detection only; choosing an abbreviation requires the author's intended meaning.
tokens:
  - '\bi\.e\.,?[ \t]+(?:such as|like|for example)\b'
