
extends: substitution
level: suggestion
message: "Remove 'please': '%s' instead of '%s'."
ignorecase: true

swap:
  ',\s*please <': ', <'
  'and please <': 'and <'
  'or please <': 'or <'
  'to please <': 'to <'
  'please, ': ''
  'please make sure': 'make sure'
  'please ensure': 'ensure'
  'please contact': 'contact'
  'please check': 'check'
  'please visit': 'visit'
  'please go to': 'go to'
  'please try': 'try'
  'please use': 'use'
  'please see': 'see'
  'please select': 'select'
  'please confirm': 'confirm'
  'please fill': 'fill'
  'please save': 'save'
  'please share': 'share'
  'please remove': 'remove'
  'please update': 'update'
  'please enter': 'enter'
  'please add': 'add'
  'please accept': 'accept'
  'please submit': 'submit'
  'please first': 'first'
  'please provide': 'provide'
  'please refer': 'refer'
  'please review': 'review'
  'please upgrade': 'upgrade'
  'please note that, ': ''
  'please note that': ''
  'please note': 'note'
  'please have': 'have'
  'please be': 'be'
  'please insert': 'insert'
  'please consider': 'consider'
  'please migrate': 'migrate'
  'please report': 'report'
  'please write': 'write'
  'please tell': 'tell'
  'please choose': 'choose'
  'please pay': 'pay'
  'please send': 'send'
  'please reply': 'reply'
  'please disregard': 'disregard'
  'please make': 'make'
  'please let': 'let'
  'please request': 'request'
  'please edit': 'edit'
  'please rent': 'rent'
  'please subscribe': 'subscribe'
  'please sign': 'sign'
  'please reconnect': 'reconnect'
  'please help': 'help'
  'please list': 'list'
  'please include': 'include'
  'please describe': 'describe'
  'please take': 'take'
  'please verify': 'verify'
  'please email': 'email'
  'please keep': 'keep'
  'please explain': 'explain'
  'please be advised that': ''

exceptions:
  - "^Please wait"
  - '\b[Pp]lease\s+help us'
  - '^Please\s+<'
  - '[.!?]\s+Please\s+<'
  - '[.!?]<\/strong>\s*[.)]*\s*Please\s+<'
  - '\b(?:invalid|error|incorrect|failed|wrong|cannot|can.t|couldn.t|won.t|isn.t|expir(?:ing|ed)|overdue|past due|suspend(?:ed|ing)?|disabled|limited|restricted|verification|verify|billing information|payment methods|invoice)\b[^.!?]*\b[Pp]lease\b'
  - '\b(?:failed|error|incorrect|couldn.t|can.t|won.t|isn.t|doesn.t match|wasn.t|expir(?:ing|ed)|overdue|suspend(?:ed|ing)?|disabled|limited|restricted|not available|not valid|not approved)\b.{0,150}[.!?]\s+[Pp]lease\b'
  - '\b(?:price.*increase|increase.*price|remove.*from your account|cost.*go up|charged.*extra|no longer valid)\b.{0,150}[.!?]\s+[Pp]lease\b'
  - '\b[Pp]lease\s+(?:help|allow|let|grant|give|permit)\s+us\b'
  - '\b[Pp]lease\s+(?:contact|reach out to|let us know|get in touch)\b'
  - '\b[Pp]lease\s+<\w+(?:Link|link)\b[^>]*>(?:contact|reach out|get in touch)'
  - '\b[Pp]lease\b[^.!?]*\b(?:invalid|error|incorrect|failed|wrong|cannot|can.t|couldn.t|won.t|isn.t|expir(?:ing|ed)|overdue|past due|suspend(?:ed|ing)?|disabled|limited|restricted|verification|verify|billing information|payment methods|invoice)\b'
  - '\b[Pp]lease\s+(?:send|submit|make)\s+(?:payment|a payment)\b'
  - '\b[Pp]lease\s+(?:pay|settle|remit)\b'
