extends: substitution
level: error
message: "Fix typo: '%s' instead of '%s'."
ignorecase: true
scope:
  - summary
  - heading
exceptions:
  - 'https?://\S+'
  # "previously selected view" - the article belongs to "previously", not "selected".
  # Without this guard, 'Selected view' → 'the selected view' fires mid-phrase.
  - "previously selected view"
swap:
  '\?\?': '?'
  'mostly likely': 'most likely'
  "there is (higher|greater|lower|bigger|smaller|better|worse) chance": "there is a $1 chance"
  "there's (higher|greater|lower|bigger|smaller|better|worse) chance": "there's a $1 chance"
  'Selected view': 'the selected view'
  tothe: 'to the'
  ofthe: 'of the'
  inthe: 'in the'
  onthe: 'on the'
  atthe: 'at the'
  forthe: 'for the'
  withthe: 'with the'
  fromthe: 'from the'
  toyou: 'to you'
  foryou: 'for you'
  withyou: 'with you'
  tous: 'to us'
  forus: 'for us'
  auser: 'a user'
  anemail: 'an email'
  anerror: 'an error'
  anaccount: 'an account'
  anissue: 'an issue'
  anoption: 'an option'
  canbe: 'can be'
  willbe: 'will be'
  shouldbe: 'should be'
  mustbe: 'must be'
  couldbe: 'could be'
  wouldbe: 'would be'
  andthe: 'and the'
  andyou: 'and you'
  andwe: 'and we'
