extends: substitution
level: suggestion
message: "Use Apify voice: '%s' instead of '%s'."

exceptions:
  # Technical/docs context - "extract" and "scraper" are correct terms
  - "<code>"
  - "API.*(?:extract|generate)"
  - "(?:extract|generate).*API"
  # Actor names that include "Scraper" (product names, not positioning)
  - '(?:Web|Google|Amazon|Facebook|Instagram|Twitter|TikTok|LinkedIn|YouTube)\s+Scraper'
  # Crawlee SDK context
  - "Crawlee"
  # Code blocks and technical content
  - "`"
  # "out-of-the-box" in compound form (already a modifier on another noun)
  - "out-of-the-box (?:experience|support|solution)"

swap:
  'Generate with AI': "We'll write this"
  'Generate description': "We'll write this"
  'Generate a description': "We'll write this"

  'unlock the power of': 'get more from'
  'unlock the potential of': 'get more from'
  'unleash the power of': 'get more from'
  'empower your workflow': 'automate your work'
  'empower your team': 'help your team'
  'discover the power of': 'try'
  'discover how': 'see how'

  'diverse business needs': 'what you need'
  'accommodate your needs': 'work for you'
  'leverage our platform': 'use Apify'
  'leverage the platform': 'use the platform'
  'leverage Apify': 'use Apify'

  'AI-ready data': 'structured data'
  'AI-ready': 'structured'
