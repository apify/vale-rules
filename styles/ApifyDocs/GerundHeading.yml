extends: existence
level: warning
message: "Gerund heading: '%s' - consider imperative ('Run the Actor') or declarative ('How to run') form."
scope: heading
ignorecase: false

exceptions:
  - "^Getting [Ss]tarted"
  - "^Troubleshooting"
  - "^(?:Error [Hh]andling|Data [Pp]rocessing|Load [Bb]alancing|Rate [Ll]imiting)"
  - "^[A-Z][a-z]+ing your"

tokens:
  - '^[A-Z][a-z]+ing the'
  - '^[A-Z][a-z]+ing a '
  - '^[A-Z][a-z]+ing an '
