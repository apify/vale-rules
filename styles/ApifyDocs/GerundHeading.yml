extends: existence
level: warning
message: "Avoid gerunds (-ing) in headings. Use noun phrases or imperatives."
scope: heading
ignorecase: false

exceptions:
  - Billing
  - Pricing
  - Debugging
  - String
  - Caching
  - Logging
  - Troubleshooting
  - Missing
  - Polling
  - Timing
  - Marketing
  - Existing
  - Pending
  - Underlying
  - Remaining
  - Corresponding
  - Incoming
  - Outgoing
  - Resulting
  - Leading
  - Following
tokens:
  - '^\w+ing\b'
