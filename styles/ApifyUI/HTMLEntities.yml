extends: substitution
level: error
message: "HTML entity in JS string: '%s' instead of '%s'."
ignorecase: false
scope: raw
exceptions:
  # &gt; inside HTML tag context (legitimate encoding for > in attributes)
  - "<[^>]*&gt;[^<]*>"
  # &amp; in URLs (query param separator)
  - 'https?://[^\s]*&amp;'
  # intentional formatting entities
  - "&rarr;"
  - "&bull;"
  - "&hellip;"
  - "&mdash;"
  - "&ndash;"
  - "&nbsp;"
  - "&times;"
  - "&copy;"
swap:
  '&apos;': "'"
  '&quot;': '"'
