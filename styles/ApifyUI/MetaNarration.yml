extends: existence
level: suggestion
message: "Meta-narration '%s'. Describe what the user gets or does, not what the UI element is."

scope: sentence

tokens:
  - '^Enter your\b'
  - '^Enter the\b'
  - '^Enter a\b'
  - '^Select a\b'
  - '^Select an\b'
  - '^Select the\b'
  - '^Select your\b'
  - '^Choose a\b'
  - '^Choose an\b'
  - '^Choose the\b'
  - '^Choose your\b'
  - '^Click to\b'
  - '^This field\b'
  - '^This setting\b'
  - '^This option\b'
  - '^This button\b'
  - '^This is the\b'
  - '^This is where you\b'
  - '^Use this to\b'
  - '^Use this field to\b'

exceptions:
  # "Enter your X in the format Y" - adds format context, not pure echo
  - 'Enter your.{0,40}(?:format|like|e\.g\.|example)'
  # "Select a date range" - common date picker label, acceptable
  - "Select a date"
  # "Use this field to test/debug" - legitimate instruction for testing contexts
  - "Use this (?:field )?to (?:test|debug|verify|preview)"
  - "Select a time"
  # "This setting is available" - factual state statement, not meta-narration
  - "This setting is available"
  # "This field is read-only" - constraint statement
  - "This (?:field|setting) is (?:read-only|required|optional|disabled)"
