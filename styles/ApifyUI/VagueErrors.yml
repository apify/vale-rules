extends: existence
level: suggestion
message: "Vague error: consider adding specificity to '%s'."
ignorecase: true
exceptions:
  - "something went wrong.*try again"
  - "something went wrong.*contact"

tokens:
  - 'something went wrong'
  - 'an error has occurred'
  - 'an unexpected error occurred'
  - 'there was a problem'
  - 'there was an error'
