extends: existence
level: suggestion
message: "Vague error: consider adding specificity to '%s'."
ignorecase: true
# Read the following recovery sentence in the same paragraph. Exceptions
# only see the matched text, so the pattern guards the immediate recovery instruction.
scope: paragraph
nonword: true

# raw fragments concatenate: apply one recovery guard to all error phrases.
raw:
  - '(?:\b(?:something went wrong|an error has occurred|an unexpected error occurred|there was a problem|there was an error)\b)'
  - '(?![.!?:;,]?\s+(?:(?:you can|to (?:fix|resolve|continue|proceed|recover),?)\s+)?(?:please,?\s+)?(?:try|retry|refresh|check|contact|sign in|log in|restart|reload|go back|update|upgrade|downgrade|remove|delete|rename|create|add|change|reset|wait)\b(?![ \t]+(?:again[ \t]+)?(?:is|are|was|were)[ \t]+(?:not\b|unavailable\b|disabled\b)))'
