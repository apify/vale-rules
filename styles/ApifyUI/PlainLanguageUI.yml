extends: substitution
level: suggestion
message: "Use plain language (UI): '%s' instead of '%s'."
ignorecase: true
nonword: true
exceptions:
  # ── Formal concept labels (the long form IS the term's identity)
  # These name a category/schema, not casual description.
  - "personal information"
  - "billing information"
  - "cardholder information"
  - "sensitive information"
  - "tax information"
  - "confidential information"
  - "contact information"
  - "payment information"
  - "card information"
  # ── UI labels/headings (proper section titles)
  - "Display information"
  - "Publication information"
  # ── Fragment risk: "information where/when/how" → "info where" is ungrammatical
  - "information where"
  - "information when"
  - "information how"

swap:
  'deprecation notice': 'deprecation message'
  'a notice': 'a message'
  'the notice': 'the message'
  'ready-made': 'ready-to-run'
  'at any time': 'anytime'
  'for more information': 'for more info'
  'returns information about': 'returns info about'
  'view information': 'view info'
  'account information': 'account info'
  'see the documentation': 'see the docs'
  'read the documentation': 'read the docs'
  'check the documentation': 'check the docs'
  'in the documentation': 'in the docs'
  'Git repository': 'Git repo'
  'source repository': 'source repo'
  'code repository': 'code repo'
