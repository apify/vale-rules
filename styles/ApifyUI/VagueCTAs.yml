# Auto-generated from rules/vague-ctas.yml
# 0 substitutions, 10 exceptions
extends: existence
level: suggestion
message: "Vague CTA: '%s' - link/button text should describe the destination or outcome, not just prompt action."

exceptions:
  - 'Go to \w'
  - '\w go \w'
  - '\w go,'
  - 'to go\b'
  - "^Close$"
  - "^Back$"
  - "^OK$"
  - "^Done$"
  - "^Dismiss$"
  - ".{20,}Learn more"

tokens:
  - 'Click here'
  - 'click here'
  - 'Get started'
  - 'Read more'
  - 'Find out more'
  - 'Start now'
  - 'Submit'
  - 'Try it'
  - 'Try it out'
  - 'Check it out'
  - 'See more'
  - 'Learn more'
  - '>here</a>'
  - '>here</'
