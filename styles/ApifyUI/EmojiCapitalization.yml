# Detection only: flags 2 patterns without suggesting replacements.
extends: existence
level: suggestion
message: "Emoji capitalization: '%s'. Capitalize after leading emoji."

tokens:
  - '(?:⏩|🚀|🆕|⚡|⚡️|⚠️|🔍|💡|🎯|🧠|🤖|📋|📝|📌|🔔|💰|📊|🛠️|✅|❌|🎉|✨|🔒|🔑|📦|🌐|💬|⭐|🏷️) [a-z]'
  - '(?:⏩|🚀|🆕|⚡|⚡️|⚠️|🔍|💡|🎯|🧠|🤖|📋|📝|📌|🔔|💰|📊|🛠️|✅|❌|🎉|✨|🔒|🔑|📦|🌐|💬|⭐|🏷️)[A-Za-z]'

action:
  name: edit
  params:
    - regex
    - '^((?:⏩|🚀|🆕|⚡|⚡️|⚠️|🔍|💡|🎯|🧠|🤖|📋|📝|📌|🔔|💰|📊|🛠️|✅|❌|🎉|✨|🔒|🔑|📦|🌐|💬|⭐|🏷️))([A-Za-z])'
    - '$1 $2'
