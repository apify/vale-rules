# Auto-generated from rules/emoji-capitalization.yml (downgraded: substitution → existence)
# Regex swaps not Vale-compatible; extracted 2 detectable patterns
extends: existence
level: suggestion
message: "Emoji capitalization: '%s'. Capitalize after leading emoji."
ignorecase: false
nonword: true

tokens:
  - '(?:⏩|🚀|🆕|⚡|⚡️|⚠️|🔍|💡|🎯|🧠|🤖|📋|📝|📌|🔔|💰|📊|🛠️|✅|❌|🎉|✨|🔒|🔑|📦|🌐|💬|⭐|🏷️) [a-z]'
  - '(?:⏩|🚀|🆕|⚡|⚡️|⚠️|🔍|💡|🎯|🧠|🤖|📋|📝|📌|🔔|💰|📊|🛠️|✅|❌|🎉|✨|🔒|🔑|📦|🌐|💬|⭐|🏷️)[A-Za-z]'

action:
  name: edit
  params:
    - regex
    - '^((?:⏩|🚀|🆕|⚡|⚡️|⚠️|🔍|💡|🎯|🧠|🤖|📋|📝|📌|🔔|💰|📊|🛠️|✅|❌|🎉|✨|🔒|🔑|📦|🌐|💬|⭐|🏷️))([A-Za-z])'
    - '$1 $2'
