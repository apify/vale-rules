
extends: existence
level: suggestion
message: "Consider restructuring possessive: '%s': role possessives can often become noun compounds."
ignorecase: false

exceptions:
  # "your [noun]" - user-centering, always keep
  - '\byour\b'
  # "Actor's" - product vocabulary, possessive is standard ("the Actor's runs")
  - '\bActor.s\b'
  # Plural possessives - can't restructure without meaning change
  - "users"
  - "customers"
  - "Actors"

tokens:
  - 'owner.s account'
  - 'owner.s email'
  - 'owner.s runs'
  - 'user.s account'
  - 'user.s billing'
  - 'user.s custom'
  - 'developer.s account'
  - 'developer.s identity'
  - 'organization.s owner'
  - 'organization.s Actors'
  - 'organization.s resources'
  - 'organization.s members'
  - 'schedule.s settings'
