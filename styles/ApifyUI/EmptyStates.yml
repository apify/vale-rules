extends: substitution
# Several swaps include final punctuation, which cannot end at a word boundary.
nonword: true
level: suggestion
message: "Replace robotic phrase: '%s' instead of '%s'."
exceptions:
  # "an additional" - article would need to change to "a" which we can't do automatically
  - "an additional"
  # "any additional" - "any more" reads oddly; double-transform with info→info makes it worse
  - "any additional"
  # "additional costs" - financial category label; "more costs" sounds wrong
  - "additional costs"
  # "no longer available" - "no" here is negation, not an empty state quantifier.
  # "This Actor is no longer available." must not become "This Actor is no longer yet."
  - "no longer available"
  # Personal form guard - "You haven't run any X" is warmer than "No X yet" (scores 4.114 vs 3.932).
  # The personal form uses second-person + contraction; protect it from any swap.
  # Determined 2026-06-07 via persona scoring of all variants.
  - "You haven.t run any"
  # Idempotency guard - prevent "No X yet" from re-matching "No X" patterns.
  # Uses [Nn] for case-insensitive matching (regex exceptions compile case-sensitive).
  - '[Nn]o \w+ yet'
  # "No events [verb]" - mid-sentence, not a standalone empty state.
  - '[Nn]o events \w'
  # "in the event of [pronoun+gerund]" - "if you losing" is grammatically wrong
  - '[Ii]n the event of (?:you|they|we|he|she|it|them|us)\s+\w+ing'
  - '(?:\[)?(?:Warning|Caution|Alert|Danger|DANGER|Important|Error)[!]*(?:\])?[!]*\s*:[\s\S]*'
  - '\w+\s+\w+\s+failed to'
  - '(?:if|you.re|you are|they.re|they are|we.re|we are|it.s|it is|he.s|he is|she.s|she is|are|is|be|been|being|to be|remain|remains|remained|feel|feels|felt|seem|seems|seemed)\s+unable to'
  - "a number of (?:items|results|records|pages|requests|runs|files|entries)"

swap:
  '\b(?:There are no Actors\.)(?!\w)': "No Actors yet."
  '\b(?:There are no invoices\.)(?!\w)': 'No invoices.'
  '\b(?:There are no items in the dataset\.)(?!\w)': 'This dataset is empty.'
  '\b(?:There are no columns in the dataset\.)(?!\w)': 'No columns in this dataset.'
  '\b(?:There are no invoices to display\.)(?!\w)': 'No invoices.'
  '\b(?:There are no payments to display\.)(?!\w)': 'No payments.'
  '\b(?:There are no payouts to display\.)(?!\w)': 'No payouts.'
  '\b(?:There are no transactions to display\.)(?!\w)': 'No transactions.'
  '\b(?:Nothing to display here\.)(?!\w)': 'Nothing here yet.'
  '\b(?:Nothing to display\.)(?!\w)': 'Nothing here yet.'
  '\b(?:No examples are available for this Actor yet\.)(?!\w)': 'No examples for this Actor yet.'
  '\b(?:Actor README isn''t available)(?!\w)': 'No Actor README yet'
  '\b(?:No data available for this date)(?!\w)': 'No data for this date'
  '\b(?:No data available)(?!\w)': 'No data yet'
  # Match the standalone empty state, not 'No events yet' or prose clauses.
  '\b(?:^No events\.?$)(?!\w)': 'No events yet.'
  '\b(?:The Actor finished with no results\. Check the log for more information\.)(?!\w)': "The Actor finished with no results. Check the log for more info."
