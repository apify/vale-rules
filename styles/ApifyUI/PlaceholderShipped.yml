
extends: existence
level: suggestion
message: "Placeholder shipped: '%s': draft copy that was never finalized."
ignorecase: false
# Bracket markers need nonword matching; prose markers keep explicit boundaries.
nonword: true

exceptions:
  - '\{[^}]*TK[^}]*\}'
  - '^\/\/.*TODO'
  - '\w{4,}\s+coming soon'
  - '^\[[ xX]\]'
  - '<[^>]+>|\{[^}]+\}'

tokens:
  - '\bTODO\b'
  - '\bFIXME\b'
  - '\bHACK\b'
  - '\[placeholder\]'
  - '\[label\]'
  - '\[TBD\]'
  - '\[tbd\]'
  - '\[copy needed\]'
  - '\[copy TK\]'
  - '\[insert'
  - '\bLorem ipsum\b'
  - '\blorem ipsum\b'
  - '\bComing soon\b'
  - '\bcoming soon\b'
