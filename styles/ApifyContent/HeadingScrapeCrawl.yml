extends: existence
level: suggestion
message: "Brand positioning: '%s' in a heading: consider broader framing (web data, automation) unless the heading names a specific technical process."
scope: heading
ignorecase: true

exceptions:
  # Technical process headings - the verb IS the function being described
  - "how (?:the|this|to) (?:scrap|crawl)"
  - "(?:scrap|crawl)(?:ing|er) (?:method|logic|mode|step|process|flow|configuration|setup|settings|options|strategy)"
  # Actor/tool name in heading - it IS the product
  - "(?:Actor|scraper|spider|crawler|tool) (?:scrap|crawl)"
  - '(?:scrap|crawl)[\s\S]{0,20}(?:Actor|scraper|spider|crawler|tool)'
  # Numbered/enumerated headings about scraping steps
  - '^#+\s*(?:Step \d|Phase \d|\d\.)[\s\S]*(?:scrap|crawl)'

tokens:
  - '^#+\s+(?:Scrape|Scraping|Crawl|Crawling) (?:the|any|all|every|your|multiple)'
  - '^#+\s+(?:Web )?(?:Scraping|Crawling) (?:with|using|for|at scale)'
  - '^#+\s+(?:Powerful|Fast|Easy|Simple|Advanced|Ultimate) (?:scraping|crawling|scraper|crawler)'
