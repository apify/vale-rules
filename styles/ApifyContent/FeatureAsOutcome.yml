extends: existence
message: "Feature bullet '%s' reads like a use case (user outcome). Features should describe capabilities ('Supports...', 'Includes...'); use cases describe goals ('Track rankings', 'Monitor competitors')."
level: suggestion
scope: sentence
tokens:
  - '\*\*[^*]+\*\*:?\s+(?:Track|Monitor|Build|Analyze|Discover|Find|Identify|Compare|Measure)\b'
